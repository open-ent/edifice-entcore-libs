name: Build & Publish to rct-nexus

# Dépôt de libs extrait d'entcore par l'amont en 6.16 (commit "feat: #SRE-5075, extract common
# libs") : common, session, broker-parent, test, probes. entcore les consomme désormais en
# dépendances Maven via ${entCoreLibsVersion}. Contrairement à entcore, il n'y a ici AUCUN
# frontend à builder (pas de gulp, pas de React, pas d'Angular) — que du Java.

on:
  push:
    branches:
      - '*-patched'
      - '*-patched-dev'
  workflow_dispatch:
    inputs:
      libs_version:
        description: 'Version à publier (ex: 6.16.3-patched). Laissez vide pour utiliser la version du pom.xml.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-and-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish entcore-libs to rct-nexus
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve revision
        run: |
          if [ -n "${{ github.event.inputs.libs_version }}" ]; then
            echo "REVISION=${{ github.event.inputs.libs_version }}" >> $GITHUB_ENV
          else
            REVISION=$(mvn help:evaluate -Dexpression=revision -q -DforceStdout -B 2>/dev/null || echo "")
            echo "REVISION=${REVISION}" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Purge des versions existantes sur rct-nexus
        # maven-releases est IMMUABLE : redeployer une version -patched deja presente renvoie 409
        # et l'ancien artefact continue d'etre servi alors que la CI affiche "success". On supprime
        # donc la version AVANT de redeployer (delete-then-deploy), comme pour les fat-jars.
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          NEXUS_BASE="https://rct-nexus.tech.fr"
          [ -n "${REVISION}" ] || { echo "Pas de revision resolue, purge sautee"; exit 0; }
          SEARCH="${NEXUS_BASE}/service/rest/v1/search?repository=maven-releases&maven.groupId=org.entcore&maven.baseVersion=${REVISION}"
          for ID in $(curl -sf -u "${NEXUS_USER}:${NEXUS_PASSWORD}" "${SEARCH}" | python3 -c "import sys,json;[print(i['id']) for i in json.load(sys.stdin).get('items',[])]"); do
            echo "Suppression du composant nexus existant ${ID}"
            curl -sf -u "${NEXUS_USER}:${NEXUS_PASSWORD}" -X DELETE "${NEXUS_BASE}/service/rest/v1/components/${ID}" || echo "::warning::echec suppression ${ID}"
          done

      - name: Build and publish to rct-nexus
        # PAS GitHub Packages, contrairement a entcore-v2 : GitHub Packages lie un nom de package a
        # UN SEUL depot, et org.entcore.common / session / broker-* / test appartiennent deja a
        # open-ent/entcore-v2 (publies du temps ou ces modules vivaient dans entcore). Un deploy
        # depuis ce depot-ci renvoie donc 422 Unprocessable Entity. Les liberer cote entcore-v2
        # casserait la resolution de org.entcore:common:6.14.9-patched pour tous les autres modules.
        # rct-nexus n'a pas cette contrainte et sert deja les fat-jars.
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          cat > /tmp/nx-settings.xml <<EOF
          <settings><servers><server><id>pt-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASSWORD}</password></server></servers></settings>
          EOF
          REVISION_OPT=""
          if [ -n "${{ github.event.inputs.libs_version }}" ]; then
            REVISION_OPT="-Drevision=${{ github.event.inputs.libs_version }}"
          fi
          mvn deploy -DskipTests -DskipITs -B -s /tmp/nx-settings.xml             ${REVISION_OPT}             -DbuildNumber="${GITHUB_SHA::8}" -DscmBranch="${GITHUB_REF_NAME}"             -DaltDeploymentRepository=pt-releases::default::https://rct-nexus.tech.fr/repository/maven-releases/

      - name: Publish fat JARs to rct-nexus
        # session et broker produisent des fat-jars consommés par le launcher (auth dépend de
        # org.entcore:session:fat en scope runtime). maven-releases est IMMUABLE : on supprime la
        # version existante AVANT de redéployer, sinon l'ancien jar persiste et le launcher sert du
        # code périmé alors que la CI affiche "success".
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          cat > /tmp/nx-settings.xml <<EOF
          <settings><servers><server><id>pt-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASSWORD}</password></server></servers></settings>
          EOF
          NEXUS_BASE="https://rct-nexus.tech.fr"
          # SURTOUT PAS de suppression du composant ici, contrairement au workflow d'entcore-v2 :
          # là-bas les jars ordinaires partent sur GitHub Packages, donc purger le composant nexus
          # avant de pousser le fat ne détruisait rien. Ici le reactor vient de déployer jars et
          # poms sur ce MÊME composant nexus (groupId:artifactId:version) : le supprimer ne
          # laisserait que le classifier fat, et entcore ne trouverait plus
          # org.entcore:broker-nats:jar:<version> (panne constatée au premier run).
          # L'unicité est déjà assurée par l'étape de purge en début de job.
          for FAT in $(find . -name "org.entcore~*~*-fat.jar" | grep -v SNAPSHOT); do
            FAT_ABS=$(realpath "${FAT}")
            BASE=$(basename "${FAT}" -fat.jar)
            GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
            echo "Deploying ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> rct-nexus"
            ( cd /tmp && mvn deploy:deploy-file -s /tmp/nx-settings.xml -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=pt-releases -Durl="${NEXUS_BASE}/repository/maven-releases/" -B )
          done
